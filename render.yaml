services:
  - type: web
    name: arrakis-ai-service
    runtime: python
    region: oregon
    plan: starter
    rootDir: ai-services
    buildCommand: pip install -r requirement.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: arrakis-frontend
          property: host
      - key: BACKEND_URL
        fromService:
          type: web
          name: arrakis-backend
          property: host
      - key: ENVIRONMENT
        value: production

  - type: web
    name: arrakis-backend
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: arrakis-ai-service
          property: hostport
      - key: FRONTEND_URL
        fromService:
          type: web
          name: arrakis-frontend
          property: host
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JUDGE0_API_URL
        sync: false
      - key: JUDGE0_API_KEY
        sync: false

  - type: web
    name: arrakis-frontend
    runtime: static
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: arrakis-backend
          property: hostport
      - key: VITE_AI_SERVICE_URL
        fromService:
          type: web
          name: arrakis-ai-service
          property: hostport
      - key: VITE_WS_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
